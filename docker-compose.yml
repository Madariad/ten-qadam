name: ten-qadam
services:
  mysql:
    image: mysql:8.4
    container_name: ten-qadam-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tenqadam
      MYSQL_USER: tenqadam
      MYSQL_PASSWORD: tenqadam_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password_only
      TZ: Asia/Almaty
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "tenqadam", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ten-qadam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change-this-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    profiles: ["storage"]

volumes:
  mysql-data:
  minio-data:
